<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Websites</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0a09; --fg: #f0e8da; --mute: #9b968c; --gold: #d9be8a; --line: rgba(240,232,218,.14); }
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 18px; padding: 32px 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font: 600 1.6rem Georgia, serif; letter-spacing: .04em; }
    a { display: block; padding: 18px 22px; border: 1px solid var(--line); border-radius: 14px; color: var(--fg); text-decoration: none; min-width: min(360px, 100%); }
    a:hover { border-color: var(--gold); }
    small { display: block; color: var(--mute); }
  </style>
</head>
<body>
  <h1>Websites</h1>
  <a href="lous-hue/">Lou's Hue <small>Tattoo art, supplies and apparel</small></a>
  <a href="kingdom-made/">Kingdom Made <small>Christian streetwear and tech</small></a>
</body>
</html>
